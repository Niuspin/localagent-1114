name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q lagent tests run.py

      - name: 单元与端到端测试（假 llama-server，不需要模型）
        run: python -m pytest -q

      - name: 浏览器冒烟测试（仅一个版本）
        if: matrix.python == '3.12'
        run: |
          python -m playwright install --with-deps chromium
          mkdir -p shots
          python tests/ui_smoke.py shots

      - name: 上传界面截图
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: shots/
          if-no-files-found: ignore

      - name: 评测脚本自检（无模型时自动跳过）
        run: python tests/eval/run_eval.py

  build-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 构建 LocalAgent.exe
        run: python packaging/build.py

      - name: 冒烟：exe 能启动并报版本
        shell: pwsh
        run: |
          $p = Start-Process dist/LocalAgent/LocalAgent.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAgent-windows
          path: dist/LocalAgent
          if-no-files-found: error
